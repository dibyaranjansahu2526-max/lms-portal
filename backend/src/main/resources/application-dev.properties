# Local verification profile. Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# The default (no profile) configuration uses MySQL as requested.
spring.datasource.url=jdbc:h2:file:./data/lms_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
